services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-school}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-school}
      POSTGRES_DB: ${POSTGRES_DB:-school_management}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Object storage for uploaded files (student photos, birth certificate scans). The bucket is private: files
  # reach users only through the API, after a permission check. MinIO Inc. stopped publishing Docker images in
  # 2025; this is a maintained community build of the same server (set MINIO_IMAGE to use another one).
  minio:
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set in .env}
    # Only reachable from this machine: the API on the host (npm run dev), the import scripts and the web console
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-off job: syncs prisma/schema.prisma to the database, seeds default data, then exits
  migrate:
    build:
      context: .
      target: build
    # pre-push.sql first: changes db push can't make without losing data (it does nothing when not needed)
    command: ["sh", "-c", "npx prisma db execute --file prisma/pre-push.sql --config prisma7.config.ts && npx prisma db push --config prisma7.config.ts && npx prisma db seed --config prisma7.config.ts"]
    # All settings from .env (SCHOOL_LEVEL, SEED_ADMIN_*, …); the values under environment override them
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-school}:${POSTGRES_PASSWORD:-school}@db:5432/${POSTGRES_DB:-school_management}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@123!}
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    # All settings from .env (JWT_EXPIRES_IN, LOGIN_*, …); the values under environment override them
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-school}:${POSTGRES_PASSWORD:-school}@db:5432/${POSTGRES_DB:-school_management}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set in .env}
      S3_ENDPOINT: http://minio:9000
      # Browsers come through the web service, whose nginx sets X-Forwarded-For to the real client address
      TRUST_PROXY: ${TRUST_PROXY:-1}
    ports:
      # This machine only by default (scripts, npm run dev, Postman): on the network, browsers use the web service.
      # Publishing it wider (API_BIND=0.0.0.0) lets a client fake its address unless TRUST_PROXY is emptied.
      - "${API_BIND:-127.0.0.1}:${API_PORT:-3000}:3000"
    # Healthy only while the API and its database both answer (the slim image has no curl, so use node)
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy

  # The web app (school-management-system): nginx serves it and forwards /api to the api service, so browsers use
  # one address. Built from the frontend repository; set FRONTEND_DIR if it isn't next to this one as below.
  web:
    build:
      context: ${FRONTEND_DIR:-../../frontend/school-management-system}
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api:3000
    ports:
      - "${WEB_PORT:-8080}:80"
    # Started with the API but not held back by it: while the API is starting or down, the app still loads and
    # shows its "can't reach the server" page, then carries on by itself
    depends_on:
      api:
        condition: service_started

  # Backs up the database when it starts and every night at BACKUP_TIME, keeping BACKUP_KEEP_DAYS days.
  # Point BACKUP_DIR at a different disk than the database, or one disk failure still loses both.
  backup:
    image: postgres:17-alpine # same major version as db, so pg_dump matches the server
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-school}
      PGPASSWORD: ${POSTGRES_PASSWORD:-school}
      PGDATABASE: ${POSTGRES_DB:-school_management}
      TZ: ${TZ:-Asia/Phnom_Penh}
      BACKUP_TIME: ${BACKUP_TIME:-02:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./docker/backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    # Unhealthy if the newest good backup is more than 25 hours old
    healthcheck:
      test: ["CMD-SHELL", "find /backups -maxdepth 1 -name '*.dump' -mmin -1500 | grep -q ."]
      interval: 1h
      start_period: 5m
      start_interval: 30s
    depends_on:
      db:
        condition: service_healthy

  # Copies the uploaded files to BACKUP_DIR/files when it starts and every night at BACKUP_TIME
  files-backup:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/files-backup.sh"]
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set in .env}
      S3_BUCKET: ${S3_BUCKET:-school-files}
      TZ: ${TZ:-Asia/Phnom_Penh}
      BACKUP_TIME: ${BACKUP_TIME:-02:00}
    volumes:
      - ./docker/files-backup.sh:/files-backup.sh:ro
      - ${BACKUP_DIR:-./backups}/files:/backups/files
    # Unhealthy if the last good copy is more than 25 hours old
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(cat /backups/files/.last-success 2>/dev/null || echo 0) )) -lt 90000"]
      interval: 1h
      start_period: 5m
      start_interval: 30s
    depends_on:
      minio:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
